[project]
name = "recolector"
version = "0.1.0"
description = "Worker de recolección de ofertas para EmpleaNet"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recolector = "recolector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recolector"]
